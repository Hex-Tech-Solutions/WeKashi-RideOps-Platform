# ============================================================
# RideOps — Production stack (Azure managed services)
#
# This compose file assumes:
#   - PostgreSQL  → Azure Database for PostgreSQL Flexible Server
#   - Redis       → Azure Cache for Redis
#   - File storage → Azure Blob Storage
#
# The postgres and redis containers are REMOVED — they are replaced by
# Azure managed services whose connection strings are in .env.prod.
#
# Bring up:   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Seed once:  docker compose --env-file .env.prod -f docker-compose.prod.yml exec api npm run db:seed
# Logs:       docker compose --env-file .env.prod -f docker-compose.prod.yml logs -f api
# Open:       http://<SERVER_IP>/  (nginx → /api → api)
# ============================================================

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # ── These come from .env.prod ──────────────────────────────────────────
      # DATABASE_URL: postgresql://user:pass@your-azure-pg.postgres.database.azure.com:5432/rideops?sslmode=require
      # REDIS_URL:    rediss://:your-redis-key@your-redis.redis.cache.windows.net:6380
      # AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=https;AccountName=...
      # AZURE_STORAGE_CONTAINER: rideops-uploads
      NODE_ENV: production
      PORT: "3000"
    # No volume mount needed — files go to Azure Blob Storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Apply DB migrations on boot, then start the server
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  web:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

# No volumes needed:
#   pgdata  → Azure PostgreSQL manages its own storage
#   uploads → Azure Blob Storage
