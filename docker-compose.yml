# ============================================================
# WeKashi RideOps — Local development stack
#
# Runs everything locally — Postgres + Redis as containers.
# The API and frontend run outside Docker (npm run dev) for
# hot reload. Use this compose only for the DB + Redis.
#
# Start DB + Redis:
#   docker compose up -d
#
# Then start the app (two terminals):
#   cd backend && npm run dev      → http://localhost:3000
#   npm run dev                    → http://localhost:8080
# ============================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: rideops
      POSTGRES_PASSWORD: rideops
      POSTGRES_DB: rideops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
