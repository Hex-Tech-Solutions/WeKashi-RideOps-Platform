upstream rideops_api {
  server api:3000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Backend REST API → Express container
  location /api/ {
    proxy_pass http://rideops_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # API responses are live data — never let the browser or the Android
    # WebView serve a cached GET. (No explicit header previously meant a
    # WebView could occasionally replay a stale response.)
    add_header Cache-Control "no-store" always;
  }

  # Health check passthrough
  location = /health {
    proxy_pass http://rideops_api;
  }

  # Socket.io (websocket upgrade) → Express container
  location /socket.io/ {
    proxy_pass http://rideops_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Long-cache built assets. These are content-hashed by Vite (index-ABC123.js),
  # so a new build produces new filenames — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # NEVER cache the entry document. index.html is the pointer to the hashed
  # bundles; if it's cached, a user keeps loading an OLD bundle after a deploy
  # (the classic "app won't update" bug, especially sticky in the Android
  # WebView). Forcing a revalidate here means every launch picks up the latest
  # build while the hashed assets above are still reused from cache.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  # SPA fallback (must stay last). Served when the path isn't a real file —
  # falls back to index.html, which carries the no-cache rule above.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
    try_files $uri /index.html;
  }
}
