# Log only failed requests (4xx/5xx). Logging every request went through
# Docker's log driver and cost dockerd about half a CPU core at ~500 req/s
# (load test, Nov 2026). The API logs its own errors as well.
map $status $log_failed {
  ~^[123] 0;
  default  1;
}

# Docker's DNS. `resolve` below re-resolves the service names every 10s, so
# nginx follows API containers when a deploy recreates them with new IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

# REST traffic: spread across `api` and the `api-extra` replicas (round robin).
# `api-extra` resolves to one address per replica.
upstream rideops_api {
  zone rideops_api 64k;
  # max_fails=0: never take a process out of rotation. They all run on this
  # server, so a dead one refuses connections at once (nginx retries GETs on
  # another) and Docker restarts it in seconds. Marking them down was worse:
  # under overload a few errors took ALL processes out and every request got
  # a 502 "no live upstreams" (load test, Nov 2026).
  server api:3000 resolve max_fails=0;
  server api-extra:3000 resolve max_fails=0;
  # Reuse connections to the API instead of opening one per request. Idle
  # ones close after 30s, before Node's 65s keepAliveTimeout (server.ts), so
  # nginx never sends a request on a connection Node has already closed.
  keepalive 128;
  keepalive_timeout 30s;
}

# Sockets stay on the main `api` process. Socket.IO's polling fallback needs
# every request of a session on the same process, and emits from the other
# processes still reach these sockets through the Redis adapter.
upstream rideops_socket {
  zone rideops_socket 64k;
  server api:3000 resolve;
}

# Don't advertise the nginx version in the Server header.
server_tokens off;

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log main if=$log_failed;
  root /usr/share/nginx/html;
  index index.html;

  # Cap request bodies at the API's max upload (5 MB) + headroom. Without this
  # nginx's 1 MB default would 413 legitimate 1–5 MB document uploads.
  client_max_body_size 6m;

  # Backend REST API → Express container
  location /api/ {
    proxy_pass http://rideops_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for the upstream keepalive pool above.
    proxy_set_header Connection "";
    # API responses are live data — never let the browser or the Android
    # WebView serve a cached GET. (No explicit header previously meant a
    # WebView could occasionally replay a stale response.)
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.conf;
  }

  # Health check passthrough
  location = /health {
    proxy_pass http://rideops_socket;
  }

  # Socket.io (websocket upgrade) → Express container
  location /socket.io/ {
    proxy_pass http://rideops_socket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Long-cache built assets. These are content-hashed by Vite (index-ABC123.js),
  # so a new build produces new filenames — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.conf;
  }

  # Face-readiness camera check (MediaPipe): ~13 MB of WebAssembly + model that
  # only change when the package is upgraded, so let the browser keep them for
  # a month instead of the "never cache" rule below.
  location /mediapipe/ {
    expires 30d;
    add_header Cache-Control "public";
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri =404;
  }
  # NEVER cache the entry document. index.html is the pointer to the hashed
  # bundles; if it's cached, a user keeps loading an OLD bundle after a deploy
  # (the classic "app won't update" bug, especially sticky in the Android
  # WebView). Forcing a revalidate here means every launch picks up the latest
  # build while the hashed assets above are still reused from cache.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback (must stay last). Served when the path isn't a real file —
  # falls back to index.html, which carries the no-cache rule above.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri /index.html;
  }
}
