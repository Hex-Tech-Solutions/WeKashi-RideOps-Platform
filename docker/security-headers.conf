# Security headers shared across every location. Included (not inherited),
# because any `add_header` inside a location block drops ALL headers added at
# an outer scope — so each location must re-include these.
#
# TLS/HSTS: TLS is terminated by the host-level reverse proxy in front of this
# container (the stack publishes nginx on 127.0.0.1:8090). HSTS is therefore
# set here and will be honoured once served over HTTPS by that proxy. If this
# container is ever exposed directly on HTTP, remove HSTS or add a real TLS
# server block.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Clickjacking: the console must never be framed.
add_header X-Frame-Options "DENY" always;
# MIME sniffing off — stops a text/* upload being interpreted as script.
add_header X-Content-Type-Options "nosniff" always;
# Minimal referrer leakage.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only geolocation is needed (driver live location); deny the rest.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# Content-Security-Policy. The SPA needs: Google Maps JS + tiles, Google Fonts,
# the Cashfree checkout SDK, inline styles (Tailwind/Radix) and wss for sockets.
# 'unsafe-inline' for style is required by the UI libs; scripts are restricted to
# self + the named Google/Cashfree origins (no 'unsafe-inline' for scripts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://maps.googleapis.com https://routes.googleapis.com https://sdk.cashfree.com wss: https:; frame-src 'self' https://sdk.cashfree.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
