name: Deploy to Server

# Auto-deploys on every push to main. The whole stack runs in Docker on the
# server, so the runner just SSHes in, pulls, and rebuilds the compose stack.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST      server public IP or DNS
#   SERVER_USER      ssh username (adminuser)
#   SERVER_PASSWORD  ssh password for that user
#   SERVER_PORT      ssh port (optional, defaults to 22)
#   SERVER_APP_DIR   repo path on the server
#                    (optional, defaults to $HOME/WeKashi-RideOps-Platform)
#
# NOTE: do not gate steps with `if: ${{ secrets.X != '' }}` — the `secrets`
# context is not available in step-level `if:` conditions, and GitHub rejects
# the whole file as invalid rather than just skipping the step.
#
# DB migrations are applied by the api container itself on boot (see the
# `command:` in docker-compose.prod.yml), and again explicitly below so a
# migration failure surfaces in the Actions log rather than in container logs.
#
# .env.prod must already exist on the server at $APP_DIR/.env.prod — it is
# never committed to git.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (password auth)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # A full image rebuild routinely takes longer than the action's
          # default timeout, which would otherwise kill the job mid-build.
          command_timeout: 20m
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            cd "${APP_DIR:-$HOME/WeKashi-RideOps-Platform}"
            echo "==> Deploying in $(pwd)"

            test -f .env.prod || { echo "ERROR: .env.prod not found in $(pwd)"; exit 1; }

            echo "==> Pulling latest code..."
            git pull --ff-only origin main

            echo "==> Applying DB migrations..."
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm api \
              npx prisma migrate deploy

            echo "==> Building & starting the full stack (postgres, redis, api, web)..."
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

            echo "==> Pruning dangling images..."
            docker image prune -f

            echo "==> Health check..."
            ok=0
            for i in $(seq 1 12); do
              if curl -sf http://localhost/health | grep -q '"status":"ok"'; then
                echo "Health OK (attempt $i)"; ok=1; break
              fi
              echo "waiting for health... ($i/12)"; sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: health check failed after ~60s — recent api logs:"
              docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=50 api
              exit 1
            fi

            echo "==> Deploy complete at $(date)"
