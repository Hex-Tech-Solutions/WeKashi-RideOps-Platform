# ============================================================
# RideOps — SELF-CONTAINED stack (Postgres + Redis as containers)
#
# Use when NOT using Azure managed services. Needs no external keys.
# This is what the live server (wekashi.in, AWS) runs, and what
# .github/workflows/deploy.yml deploys.
#
# DATABASE_URL and REDIS_URL are built here from the POSTGRES_* values in
# .env.prod, so .env.prod does not need to define them itself.
#
#   Bring up: sudo docker compose --env-file .env.prod -f docker-compose.demo.yml up -d --build
#   Seed:     sudo docker compose --env-file .env.prod -f docker-compose.demo.yml exec api npm run db:seed
#   Logs:     sudo docker compose --env-file .env.prod -f docker-compose.demo.yml logs -f api
#
# NOTE: `web` publishes to 127.0.0.1:8090 (loopback only) — a host-level
# reverse proxy terminates TLS and forwards to it. It is deliberately not
# bound to 0.0.0.0:80.
# ============================================================

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    command: postgres -c max_connections=100 -c shared_buffers=1GB -c effective_cache_size=3GB -c work_mem=8MB
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    build: ./backend
    restart: unless-stopped
    # Lets the API finish its graceful shutdown (final GPS flush) before
    # Docker sends SIGKILL. Keep above the 15s forced exit in server.ts.
    stop_grace_period: 20s
    env_file: .env.prod
    # FCM service-account key (push notifications). Put the JSON downloaded from
    # Firebase Console → Project Settings → Service accounts into ./secrets/ on
    # the host as fcm-service-account.json. It's mounted read-only into the
    # container at the path FCM_SERVICE_ACCOUNT_JSON points to (set in .env.prod
    # to /app/secrets/fcm-service-account.json). The ./secrets dir is gitignored.
    volumes:
      - ./secrets:/app/secrets:ro
      # Driver documents + payout files (local-disk storage, used because
      # AZURE_STORAGE_CONNECTION_STRING is unset). MUST be a named volume:
      # without it /app/uploads lives inside the container and every deploy
      # (which rebuilds the container) silently deletes every uploaded file.
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=25&pool_timeout=20
      REDIS_URL: redis://redis:6379
      # 'production': this stack now runs the live wekashi.in server.
      # This value overrides NODE_ENV in .env.prod (compose `environment:`
      # beats `env_file:`). In production the API:
      #   - refuses to start unless CORS_ORIGIN is a specific origin (not *)
      #   - refuses to start if a JWT secret is a known insecure default
      #   - returns a generic "Internal server error" instead of real messages
      #   - does not log every Prisma query
      # Driver OTPs are unaffected: with no SMS provider configured they are
      # still written to this container's log.
      NODE_ENV: production
      PORT: "3000"
      UV_THREADPOOL_SIZE: "8"
      NODE_OPTIONS: "--max-old-space-size=1536"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    mem_limit: 2500m
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  # Extra API processes on the same server, so the API uses more than one CPU
  # core (load test, Nov 2026: one Node process saturated at ~1,300 drivers
  # with the app open). Same code as `api`, but:
  #   - no migrations (api runs them and must be healthy first)
  #   - RUN_BACKGROUND_JOBS=0: sweepers, reminders and the GPS flush run only
  #     in `api`, so nothing is sent or written twice
  #   - nginx sends /api/* to api + both replicas; sockets stay on `api`
  # Rate limits and caches live in Redis, so all processes share them.
  api-extra:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      replicas: 2
    env_file: .env.prod
    volumes:
      - ./secrets:/app/secrets:ro
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=25&pool_timeout=20
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: "3000"
      UV_THREADPOOL_SIZE: "8"
      NODE_OPTIONS: "--max-old-space-size=1024"
      RUN_BACKGROUND_JOBS: "0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: node dist/server.js
    mem_limit: 1500m
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  web:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      api-extra:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    # nginx proxies every driver socket; the default 1024 file limit made it
    # fail all requests at ~2,000 open sockets (load test, Nov 2026).
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

volumes:
  pgdata:
  uploads:
